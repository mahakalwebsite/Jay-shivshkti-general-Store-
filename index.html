<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jay ShivShakti General Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f0eb;color:#1a1108;min-height:100vh}
/* ===LOGIN=== */
#LS{position:fixed;inset:0;z-index:999;background:linear-gradient(145deg,#120701,#2e1204 50%,#0a1228);display:flex;flex-direction:column;align-items:center;padding:0 16px 20px;overflow-y:auto}
.LTOP{width:100%;max-width:360px;display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.LLOGO{width:40px;height:40px;background:linear-gradient(135deg,#f7813a,#b84510);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.LNAME{font-size:15px;font-weight:800;color:#fff;line-height:1.2}
.LSUB2{font-size:9px;color:rgba(255,255,255,.35)}
.LCLK{margin-left:auto;text-align:right;font-size:12px;color:rgba(255,255,255,.5);font-weight:700}
.LCLK2{font-size:9px;color:rgba(255,255,255,.25)}
.LTABS{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px;width:100%;max-width:360px;margin-bottom:12px;border:1px solid rgba(255,255,255,.1)}
.LTAB{flex:1;padding:9px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:800;transition:all .2s;background:none;color:rgba(255,255,255,.45)}
.LTAB.on{background:linear-gradient(135deg,#f7813a,#c04410);color:#fff;box-shadow:0 3px 10px rgba(224,92,26,.4)}
.LTAB.on2{background:linear-gradient(135deg,#27ae60,#1a8a48);color:#fff;box-shadow:0 3px 10px rgba(39,174,96,.35)}
.LCARD{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:20px;padding:22px 18px;width:100%;max-width:360px}
.LERR{background:rgba(231,76,60,.15);border:1px solid rgba(231,76,60,.3);border-radius:9px;padding:9px 12px;color:#ff8a80;font-size:11px;margin-bottom:11px;display:none;text-align:center}
.LSUC{background:rgba(39,174,96,.15);border:1px solid rgba(39,174,96,.3);border-radius:9px;padding:9px 12px;color:#7fff7f;font-size:11px;margin-bottom:11px;display:none;text-align:center}
.LLB{font-size:10px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:.5px;display:block;margin-bottom:5px}
.LIN{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);color:#fff;font-size:13px;font-weight:600;outline:none;margin-bottom:12px;transition:border-color .2s}
.LIN:focus{border-color:#f7813a}
.LIN::placeholder{color:rgba(255,255,255,.25)}
.LBTN{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#f7813a,#c04410);color:#fff;font-size:14px;font-weight:800;box-shadow:0 6px 20px rgba(224,92,26,.4)}
.LBTN2{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(135deg,#27ae60,#1a8a48);color:#fff;font-size:14px;font-weight:800;margin-top:2px}
.LBTN3{width:100%;padding:10px;border-radius:10px;border:1.5px solid rgba(255,255,255,.14);background:none;color:rgba(255,255,255,.4);font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
.LFGT{text-align:center;margin-top:12px;font-size:11px;color:rgba(247,129,58,.75);font-weight:700;cursor:pointer;border-bottom:1px dashed rgba(247,129,58,.3);display:inline-block;padding-bottom:1px}
.RPREVIEW{display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;margin-bottom:11px}
.RCHIP{padding:9px 7px;border-radius:10px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);cursor:pointer;text-align:center;transition:all .15s}
.RCHIP.on{background:rgba(247,129,58,.18);border-color:#f7813a}
.FNOTE{text-align:center;margin-top:11px;font-size:10px;color:rgba(255,255,255,.18);line-height:1.6}
/* ===APP=== */
#AH{background:linear-gradient(135deg,#e05c1a,#b84510);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(224,92,26,.25)}
.HT{display:flex;align-items:center;justify-content:space-between;padding:9px 13px 5px}
.AT{font-size:17px;font-weight:800}.AT b{color:#ffd9b5}
.HU{display:flex;align-items:center;gap:7px}
.HUN{font-size:11px;font-weight:800;color:#fff}
.LOUT{background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;border-width:1px;border-style:solid}
.TB{display:flex;border-top:1px solid rgba(255,255,255,.15);overflow-x:auto;scrollbar-width:none}
.TB::-webkit-scrollbar{display:none}
.TBT{flex-shrink:0;padding:8px 12px;cursor:pointer;font-size:11px;font-weight:700;color:rgba(255,255,255,.55);background:none;border:none;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.TBT.on{color:#fff;border-bottom-color:#ffd9b5}
.TBT.hd{display:none!important}
.SEC{display:none;padding:13px}.SEC.on{display:block}
.main{padding-bottom:74px}
/* ===BUTTONS=== */
.btn{padding:9px 14px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.bp{background:#e05c1a;color:#fff}.bg{background:#27ae60;color:#fff}.br{background:#e74c3c;color:#fff}
.bb{background:#1a5fe0;color:#fff}.bv{background:#8e44ad;color:#fff}
.bo{background:none;border:1.5px solid #e2d5c5;color:#7a6650}
.bsm{padding:5px 10px;font-size:10px;border-radius:7px}
/* ===INPUTS=== */
.inp{width:100%;padding:9px 12px;border-radius:9px;border:1.5px solid #e2d5c5;font-size:12px;background:#fff;color:#1a1108;outline:none}
.inp:focus{border-color:#e05c1a}
.FG{margin-bottom:10px}
.FG label{display:block;font-size:9px;font-weight:800;color:#7a6650;margin-bottom:4px;letter-spacing:.3px}
.FG input,.FG select,.FG textarea{width:100%;padding:9px 11px;border-radius:9px;border:1.5px solid #e2d5c5;font-size:12px;background:#f4f0eb;color:#1a1108;outline:none}
.FG input:focus,.FG select:focus{border-color:#e05c1a}
.SH{font-size:15px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.SH::after{content:'';flex:1;height:2px;background:linear-gradient(to right,#e05c1a,transparent);border-radius:2px}
.AB{display:flex;gap:8px;margin-bottom:11px;align-items:center}
/* ===CARDS=== */
.card{background:#fff;border-radius:13px;box-shadow:0 3px 14px rgba(224,92,26,.08);border:1.5px solid #e2d5c5}
/* ===CATEGORY GRID=== */
.CG{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.CC{background:#fff;border-radius:13px;overflow:hidden;box-shadow:0 3px 14px rgba(224,92,26,.08);border:1.5px solid #e2d5c5;position:relative;cursor:pointer;transition:transform .16s}
.CC:hover{transform:translateY(-2px)}
.CI{width:100%;height:80px;background:linear-gradient(135deg,#f5d7b8,#f9c09a);display:flex;align-items:center;justify-content:center;font-size:34px}
.CB{padding:9px 11px 11px}
.CN{font-size:12px;font-weight:800;margin-bottom:2px}.CM{font-size:10px;color:#7a6650}
.CA{position:absolute;top:5px;right:5px;display:flex;gap:3px;opacity:0;transition:.18s}
.CC:hover .CA{opacity:1}
.IB{width:26px;height:26px;border-radius:6px;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.IE{background:rgba(255,255,255,.9);color:#e05c1a}.ID{background:rgba(231,76,60,.88);color:#fff}
/* ===ITEMS=== */
.IL{display:flex;flex-direction:column;gap:9px}
.IC{background:#fff;border-radius:13px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.06);border:1.5px solid #e2d5c5}
.ICH{display:flex;align-items:center;gap:10px;padding:11px 12px 8px}
.ICEMJ{font-size:24px;width:38px;text-align:center;flex-shrink:0}
.ICIN{flex:1}
.ICNM{font-size:13px;font-weight:800}
.ICCAT{font-size:9px;padding:2px 7px;border-radius:20px;background:#fdf0e8;color:#e05c1a;font-weight:700;display:inline-block;margin-top:2px}
.ICUN{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #e2d5c5}
.UC{padding:8px 7px;text-align:center;border-right:1px solid #e2d5c5}
.UC:last-child{border-right:none}
.UCI{font-size:14px;margin-bottom:1px}
.UCL{font-size:8px;font-weight:800;color:#7a6650;text-transform:uppercase;letter-spacing:.3px}
.UCQ{font-size:11px;font-weight:800;margin-top:1px}
.UCPR{font-size:11px;font-weight:700}
.PRC{color:#e74c3c}.PRD{color:#1a5fe0}.PRA{color:#8e44ad}
.ICPR{display:grid;grid-template-columns:1fr 1fr 1fr;background:#fafaf8;border-top:1px solid #e2d5c5;padding:5px 0}
.PR{text-align:center;border-right:1px solid #e2d5c5}
.PR:last-child{border-right:none}
.PRL{font-size:8px;font-weight:800;color:#7a6650;letter-spacing:.2px}
.PRV{font-size:12px;font-weight:800}
/* ===MILK=== */
.MH{background:linear-gradient(135deg,#1a5fe0,#1244b8);border-radius:13px;padding:13px;color:#fff;margin-bottom:12px}
.MH h2{font-size:16px;font-weight:800}.MH p{font-size:10px;color:rgba(255,255,255,.65);margin-top:2px}
.DM{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.MF label{font-size:9px;color:#7a6650;font-weight:700;display:block;margin-bottom:3px}
.MF input,.MF select{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #e2d5c5;font-size:12px;background:#fff;color:#1a1108;outline:none}
.TW{overflow-x:auto;border-radius:11px;box-shadow:0 3px 14px rgba(26,95,224,.1)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:11px;min-width:460px}
thead{background:linear-gradient(135deg,#1a5fe0,#1244b8);color:#fff}
thead th{padding:9px 10px;text-align:left;font-weight:800;font-size:10px}
tbody tr{border-bottom:1px solid #e2d5c5}
tbody td{padding:8px 10px;vertical-align:middle}
tbody td input[type="number"]{width:65px;padding:5px;border-radius:7px;border:1.5px solid #e2d5c5;font-size:11px;text-align:center;outline:none}
.DF{background:#fff;border-radius:11px;padding:12px 13px;margin-top:9px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;box-shadow:0 3px 14px rgba(0,0,0,.06);border:1.5px solid #e2d5c5}
.FS label{font-size:9px;color:#7a6650;font-weight:800;display:block}
.FS .FV{font-size:15px;font-weight:800;color:#1a5fe0}
/* ===USERS=== */
.UG{display:flex;flex-direction:column;gap:10px}
.UCR{background:#fff;border-radius:13px;box-shadow:0 3px 14px rgba(0,0,0,.06);border:1.5px solid #e2d5c5;overflow:hidden}
.UCRT{display:flex;align-items:center;gap:10px;padding:12px 13px}
.AV{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.AVadmin{background:linear-gradient(135deg,#f6d365,#fda085)}
.AVmanager{background:linear-gradient(135deg,#84fab0,#8fd3f4)}
.AVstaff{background:linear-gradient(135deg,#a8edea,#fed6e3)}
.AVagent{background:linear-gradient(135deg,#fccb90,#d57eeb)}
.AVdistributor{background:linear-gradient(135deg,#c471f5,#fa71cd)}
.AVcustomer{background:linear-gradient(135deg,#ffecd2,#fcb69f)}
.UD{flex:1}
.UN{font-size:13px;font-weight:800}
.UM{font-size:10px;color:#7a6650;margin-top:1px}
.RT{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:800;margin-top:3px}
.RTadmin{background:#fff4e0;color:#e05c1a}.RTmanager{background:#e8f8ee;color:#27ae60}
.RTstaff{background:#e8f0fe;color:#1a5fe0}.RTagent{background:#fde8f8;color:#8e44ad}
.RTdistributor{background:#f0e8fe;color:#6c3483}.RTcustomer{background:#fff0f5;color:#e74c3c}
.SD{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.SON{background:#2ecc71}.SOF{background:#e74c3c}
.UCFG{display:none;border-top:1px solid #e2d5c5;padding:12px 13px;background:#fafaf8}
.UCFG.op{display:block}
.CATAC{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.CATC{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;border:1.5px solid #e2d5c5;background:#fff;cursor:pointer;font-size:10px;font-weight:700;transition:all .13s}
.CATC.on{background:#e8f0fe;border-color:#1a5fe0;color:#1a5fe0}
.CATC.on .CHK{background:#1a5fe0;border-color:#1a5fe0;color:#fff}
.CHK{width:13px;height:13px;border-radius:3px;border:1.5px solid #e2d5c5;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px}
.PTC{padding:5px 10px;border-radius:20px;border:1.5px solid #e2d5c5;font-size:10px;font-weight:700;cursor:pointer;background:#fff;color:#7a6650}
.PTC.sc{background:#fdf0e8;border-color:#e05c1a;color:#e05c1a}
.PTC.sd{background:#e8f0fe;border-color:#1a5fe0;color:#1a5fe0}
.PTC.sa{background:#f0e8fe;border-color:#8e44ad;color:#8e44ad}
/* ===SALES=== */
.SC{background:#fff;border-radius:13px;padding:13px;margin-bottom:12px;border:1.5px solid #e2d5c5;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.FR2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.SL{display:flex;flex-direction:column;gap:8px}
.SE{background:#fff;border-radius:10px;padding:10px 12px;border:1.5px solid #e2d5c5}
.SH2{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.SN{font-weight:800;font-size:12px}.SA{font-size:14px;font-weight:800;color:#e05c1a}.SM{font-size:9px;color:#7a6650}
/* ===ORDERS=== */
.OC{background:#fff;border-radius:11px;padding:11px 12px;margin-bottom:9px;border:1.5px solid #e2d5c5;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.OH{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.OID{font-size:9px;color:#7a6650;font-weight:700}
.OST{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:800}
.OSP{background:#fff4e0;color:#e05c1a}.OSC{background:#e8f8ee;color:#27ae60}.OSD{background:#e8f0fe;color:#1a5fe0}
/* ===DIST=== */
.DSG{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.DSC{background:#fff;border-radius:11px;padding:11px;border:1.5px solid #e2d5c5;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.DSV{font-size:19px;font-weight:800;color:#1a5fe0}.DSL{font-size:9px;color:#7a6650;font-weight:700;margin-top:2px}
/* ===SHOP=== */
.SBN{background:linear-gradient(135deg,#e74c3c,#c0392b);border-radius:13px;padding:13px;color:#fff;margin-bottom:12px}
.SGR{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.SPC{background:#fff;border-radius:13px;overflow:hidden;border:1.5px solid #e2d5c5;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.SPTOP{background:linear-gradient(135deg,#fdf0e8,#fce0c8);padding:14px;text-align:center}
.SPEMJ{font-size:36px;margin-bottom:3px}.SPNM{font-size:12px;font-weight:800}
.SPBODY{padding:10px 10px 11px}
.SPPR{font-size:18px;font-weight:800;color:#e74c3c}
.SADD{width:100%;margin-top:8px;padding:8px;border-radius:8px;border:none;cursor:pointer;background:#e05c1a;color:#fff;font-size:11px;font-weight:800}
/* ===MODAL=== */
.MO{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}
.MO.op{display:flex}
.MD{background:#fff;border-radius:16px;padding:18px 15px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow-y:auto;animation:SU .2s ease}
@keyframes SU{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}
.MD h3{font-size:15px;font-weight:800;margin-bottom:13px}
.MBTNS{display:flex;gap:7px;margin-top:14px}.MBTNS .btn{flex:1;justify-content:center}
/* ===PRICE GRID=== */
.PRGRID{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:5px}
.PB{background:#f4f0eb;border-radius:9px;padding:8px 9px;border:1.5px solid #e2d5c5}
.PB label{font-size:9px;font-weight:800;display:block;margin-bottom:3px}
.PBc label{color:#e74c3c}.PBd label{color:#1a5fe0}.PBa label{color:#8e44ad}
.PB input{width:100%;padding:6px;border-radius:7px;border:1.5px solid #e2d5c5;font-size:12px;text-align:center;background:#fff;outline:none}
/* ===UNIT=== */
.USEC{background:#f4f0eb;border-radius:11px;border:1.5px solid #e2d5c5;padding:12px;margin-bottom:10px}
.USEC h4{font-size:10px;font-weight:800;color:#7a6650;letter-spacing:.4px;margin-bottom:9px;text-transform:uppercase}
.UGRID{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.UPRESETS{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.UP{padding:5px 10px;border-radius:20px;background:#fff;border:1.5px solid #e2d5c5;font-size:10px;font-weight:700;cursor:pointer;color:#1a1108;transition:all .13s}
.UP:hover{background:#fdf0e8;border-color:#e05c1a;color:#e05c1a}
.QPRESETS{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.QP{padding:4px 9px;border-radius:20px;border:1.5px solid #e2d5c5;background:#fff;font-size:10px;font-weight:700;cursor:pointer;color:#1a1108}
.QP:hover{background:#e8f0fe;border-color:#1a5fe0;color:#1a5fe0}
/* ===DASHBOARD=== */
.DASH{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.DC{background:#fff;border-radius:13px;padding:13px;border:1.5px solid #e2d5c5;box-shadow:0 3px 14px rgba(0,0,0,.06)}
/* ===EMOJI PICKER=== */
.EP{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px;max-height:160px;overflow-y:auto}
.EO{font-size:20px;text-align:center;padding:5px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:background .13s}
.EO:hover{background:#f5eee7}.EO.ES{border-color:#e05c1a;background:#fdf0e8}
/* ===TOAST=== */
.TOAST{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:#1a1108;color:#fff;padding:8px 17px;border-radius:30px;font-size:11px;font-weight:700;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.TOAST.show{opacity:1}
/* ===EMPTY=== */
.EMP{text-align:center;padding:34px 16px;color:#7a6650}.EI{font-size:44px;margin-bottom:7px}
/* ===BOTTOM NAV=== */
.BN{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2d5c5;display:flex;z-index:90;box-shadow:0 -3px 12px rgba(0,0,0,.07)}
.BNB{flex:1;padding:8px 0;text-align:center;cursor:pointer;font-size:8px;font-weight:700;color:#7a6650;background:none;border:none;transition:color .18s;min-width:0}
.BNB .BI{font-size:18px;display:block;margin-bottom:1px}
.BNB.on{color:#e05c1a}
.BNB.hd{display:none!important}
/* ===INFO PILL=== */
.IP{background:linear-gradient(135deg,rgba(224,92,26,.08),rgba(26,95,224,.05));border-radius:11px;padding:11px;border:1.5px solid #e2d5c5;margin-bottom:12px}
/* ===OTP=== */
.OTPBOX{background:rgba(247,129,58,.08);border:1.5px solid rgba(247,129,58,.3);border-radius:12px;padding:14px;text-align:center;margin-bottom:13px}
.OTPVAL{font-size:36px;font-weight:800;color:#f7813a;letter-spacing:10px;font-family:monospace}
.STRENGTH{height:5px;background:#e2d5c5;border-radius:4px;overflow:hidden;margin-bottom:4px}
.STR{height:100%;width:0;transition:width .3s,background .3s;border-radius:4px}
@media print{#LS,#AH,.BN,.MA,button{display:none!important}#sec-milk{display:block!important;padding:0}}
</style>
</head>
<body>

<!-- ===LOGIN=== -->
<div id="LS">

  <!-- Top Bar -->
  <div class="LTOP">
    <div class="LLOGO">🛒</div>
    <div>
      <div class="LNAME">Jay ShivShakti</div>
      <div class="LSUB2">General Store</div>
    </div>
